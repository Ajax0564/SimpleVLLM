<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimpleVLLM Chat</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #171717; color: #ececec; }
    main { max-width: 860px; min-height: 100vh; margin: auto; display: flex; flex-direction: column; }
    header { padding: 24px 20px 12px; border-bottom: 1px solid #303030; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; }
    #status { color: #999; font-size: 13px; margin-top: 5px; }
    #messages { flex: 1; padding: 24px 20px 120px; }
    .message { max-width: 760px; padding: 14px 16px; margin: 0 auto 14px; border-radius: 8px; white-space: pre-wrap; line-height: 1.5; }
    .user { background: #2b2b2b; }
    .assistant { background: #202020; }
    .label { color: #999; font-size: 12px; margin-bottom: 5px; }
    form { position: fixed; bottom: 0; left: 0; right: 0; padding: 14px 20px 20px; background: linear-gradient(transparent, #171717 20%); }
    .composer { max-width: 820px; margin: auto; display: flex; gap: 10px; }
    textarea { flex: 1; resize: none; min-height: 48px; max-height: 140px; padding: 13px; border: 1px solid #484848; border-radius: 8px; background: #242424; color: inherit; font: inherit; }
    button { border: 0; border-radius: 8px; padding: 0 18px; background: #e8e8e8; color: #151515; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    .empty { color: #888; text-align: center; padding-top: 20vh; }
  </style>
</head>
<body>
  <main>
    <header><h1>SimpleVLLM Chat</h1><div id="status">Local model</div></header>
    <section id="messages"><div class="empty">Start a conversation</div></section>
    <form id="form">
      <div class="composer">
        <textarea id="input" placeholder="Message the model..." rows="1" required></textarea>
        <button id="send" type="submit" aria-label="Send message">Send</button>
      </div>
    </form>
  </main>
  <script>
    let conversationId = null;
    const messages = document.querySelector('#messages');
    const input = document.querySelector('#input');
    const send = document.querySelector('#send');
    const status = document.querySelector('#status');

    function render(history) {
      messages.replaceChildren();
      for (const item of history) {
        const wrapper = document.createElement('div');
        wrapper.className = `message ${item.role}`;
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = item.role === 'user' ? 'You' : 'Assistant';
        const content = document.createElement('div');
        content.textContent = item.content;
        wrapper.append(label, content);
        messages.append(wrapper);
      }
      window.scrollTo(0, document.body.scrollHeight);
    }

    document.querySelector('#form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = '';
      send.disabled = true;
      status.textContent = 'Generating...';
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({conversation_id: conversationId, message})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Request failed');
        conversationId = data.conversation_id;
        render(data.history);
        status.textContent = 'Local model';
      } catch (error) {
        status.textContent = error.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
